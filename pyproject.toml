[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "umd-sched"
version = "0.1.0"
description = "Find the most efficient UMD class schedules from the Schedule of Classes (a command-line Venus)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
fast = ["lxml"]

[project.scripts]
umd-sched = "umdsched.cli:main"

[tool.setuptools]
packages = ["umdsched", "umdsched.sources"]
